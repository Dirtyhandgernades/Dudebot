[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deca-smg-notifier"
version = "1.0.0"
description = "Evidence-backed IPO and direct-offering Discord screener"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "pydantic>=2.10,<3", "PyYAML>=6,<7", "beautifulsoup4>=4.12,<5", "exchange-calendars>=4.9,<5", "pandas>=2.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
smg-notifier = "smg.cli:main"

[tool.setuptools.packages.find]
include = ["smg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
