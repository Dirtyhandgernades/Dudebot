name: OBSIDIAN EOD calendar source-contract shadow (offline research only)
on:
  push:
    branches: [research/obsidian-early-rug-20261025]
    paths:
      - 'backtest/obsidian_eod_source_preflight.py'
      - 'backtest/obsidian_two_provider_close_reconciliation.py'
      - 'tests/test_obsidian_prospective_eod_source_preflight.py'
      - 'tests/test_obsidian_eod_calendar_contract_shadow.py'
      - '.github/workflows/obsidian-eod-calendar-source-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    if: github.ref == 'refs/heads/research/obsidian-early-rug-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate fail-closed published-calendar and all-source preflight
        run: python -m unittest tests.test_obsidian_prospective_eod_source_preflight tests.test_obsidian_eod_calendar_contract_shadow -v
