      - 'tests/test_obsidian_prospective_catalyst_publication.py'
      - 'backtest/obsidian_iex_outcomes.py'
      - 'tests/test_obsidian_prospective_iex_outcomes.py'
      - 'backtest/obsidian_iex_prospective.py'
      - 'tests/test_obsidian_prospective_iex_capture.py'
      - '.github/workflows/obsidian-iex-prospective-capture.yml'
      - 'backtest/obsidian_prospective_outcomes.py'
      - 'tests/test_obsidian_prospective_outcomes.py'
      - 'backtest/obsidian_regular_close_integrity.py'
      - 'backtest/obsidian_eod_source_preflight.py'
      - 'backtest/obsidian_forward_source_contract_shadow.py'
      - 'backtest/obsidian_forward_eod_intake.py'
      - 'backtest/obsidian_forward_horizon_shadow.py'
      - 'tests/test_obsidian_prospective_forward_horizon_shadow.py'
      - 'backtest/OBSIDIAN_FORWARD_NEXT_THREE_SESSIONS_FROZEN_2026_10_28.md'
