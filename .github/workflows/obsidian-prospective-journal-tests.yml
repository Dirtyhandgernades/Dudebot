name: OBSIDIAN prospective journal and capture tests (research only)
on:
  push:
    branches:
      - research/obsidian-early-rug-20261025
    paths:
      - 'backtest/obsidian_prospective_journal.py'
      - 'tests/test_obsidian_prospective_journal.py'
      - 'backtest/obsidian_prospective_capture.py'
      - 'tests/test_obsidian_prospective_capture.py'
      - 'backtest/obsidian_prospective_verify.py'
      - 'tests/test_obsidian_prospective_verify.py'
      - 'backtest/obsidian_early_mechanism_audit.py'
      - 'tests/test_obsidian_prospective_mechanism.py'
      - 'backtest/obsidian_watchlist_reconcile.py'
      - 'tests/test_obsidian_prospective_watchlist.py'
      - 'backtest/obsidian_historical_watchlist_manifest_2026_10_26.json'
      - 'tests/test_obsidian_prospective_watchlist_manifest.py'
      - '.github/workflows/obsidian-prospective-journal-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obsidian-prospective-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prospective-journal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate frozen prospective journal and independent capture (offline)
        run: python -m unittest discover -s tests -p 'test_obsidian_prospective_*.py' -v
