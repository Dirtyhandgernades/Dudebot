      - 'backtest/obsidian_forward_calendar_shadow.py'
      - 'tests/test_obsidian_prospective_forward_calendar_shadow.py'
      - 'tests/test_obsidian_prospective_forward_source_contract_shadow.py'
      - 'tests/test_obsidian_prospective_eod_source_preflight.py'
      - 'tests/test_obsidian_prospective_regular_close_integrity.py'
      - 'tests/test_obsidian_prospective_extended_quote_integrity.py'
      - 'tests/test_obsidian_prospective_afterhours.py'
      - 'backtest/obsidian_supplemental_watchlist_2026_10_26.json'
      - 'tests/test_obsidian_prospective_supplemental_watchlist.py'
      - 'backtest/obsidian_early_discovery.py'
      - 'backtest/obsidian_forward_collapse_study.py'
      - 'backtest/obsidian_iex_preclose_band_gap_audit.py'
      - 'tests/test_obsidian_prospective_iex_preclose_band_gap.py'
      - 'backtest/obsidian_matched_cohort_lock.py'
      - 'backtest/obsidian_retained_freshness_shadow.py'
      - 'tests/test_obsidian_prospective_retained_freshness_shadow.py'
      - 'tests/test_obsidian_prospective_matched_cohort_lock.py'
      - 'backtest/obsidian_iex_capture_transitions.py'
      - 'tests/test_obsidian_prospective_iex_capture_transitions.py'
      - 'tests/test_obsidian_prospective_forward_collapse_study.py'
      - 'backtest/OBSIDIAN_IEX_FORWARD_STUDY_FROZEN_2026_10_27.md'
      - 'backtest/obsidian_iex_research_discovery.py'
      - 'backtest/obsidian_exchange_scope_audit.py'
      - 'tests/test_obsidian_prospective_exchange_scope_audit.py'
      - 'tests/test_obsidian_prospective_iex_research_discovery.py'
      - '.github/workflows/obsidian-iex-research-discovery.yml'
      - 'backtest/obsidian_early_discovery_packet.py'
      - 'tests/test_obsidian_prospective_early_discovery_packet.py'
      - 'backtest/obsidian_oct26_observation_provenance.json'
      - 'tests/test_obsidian_prospective_early_discovery.py'
      - 'backtest/obsidian_workflow_failure_guard.py'
      - 'tests/test_obsidian_prospective_workflow_failure_guard.py'
      - '.github/workflows/obsidian-prospective-journal-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obsidian-prospective-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prospective-journal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate frozen prospective journal and independent capture (offline)
        run: python -m unittest discover -s tests -p 'test_obsidian_prospective_*.py' -v
