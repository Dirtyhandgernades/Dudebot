      - 'backtest/obsidian_historical_watchlist_manifest_2026_10_26.json'
      - 'tests/test_obsidian_prospective_watchlist_manifest.py'
      - 'backtest/obsidian_discretionary_tiers.py'
      - 'tests/test_obsidian_prospective_discretionary_tiers.py'
      - 'backtest/obsidian_afterhours_catchability.py'
      - 'backtest/obsidian_extended_quote_integrity.py'
      - 'backtest/obsidian_delayed_sip_integrity.py'
      - 'tests/test_obsidian_prospective_delayed_sip_integrity.py'
