name: OBSIDIAN historical data audit (research only)
on:
  push:
    branches:
      - research/obsidian-early-rug-20261025
    paths:
      - 'backtest/obsidian_data_audit.py'
      - 'backtest/obsidian_early_rug.py'
      - 'backtest/obsidian_recover_windows.py'
      - '.github/workflows/obsidian-historical-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: obsidian-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve original historical replay artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow_conclusion: success
          run_id: 37386241124
          name: pre-close-firm-37386241124
          path: outputs/backtest/hybrid-37386241124
          if_no_artifact_found: fail
      - name: Verify required replay files
        run: |
          find outputs/backtest/hybrid-37386241124 -maxdepth 3 -type f | head -50
          test -f outputs/backtest/hybrid-37386241124/firm-timing-inputs.json.gz
          for year in 2023 2024 2025; do
            test -f outputs/backtest/hybrid-37386241124/$year-hybrid-signals.json
            test -f outputs/backtest/hybrid-37386241124/$year-intraday-audit.json
          done
      - name: Audit cached replay inputs (fail closed)
        run: |
          mkdir -p outputs/backtest
          python -m backtest.obsidian_data_audit \
            --source outputs/backtest/hybrid-37386241124 \
            --output outputs/backtest/obsidian-data-audit.json
      - name: Install replay dependencies
        run: python -m pip install -e .
      - name: Restore newest recovery checkpoint and bar cache
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/backtest/obsidian-recovery
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name | startswith("obsidian-recovery-"))) | [.created_at, .name] | join(" ")' > "$RUNNER_TEMP/obsidian-artifacts.txt"
          artifact_name=$(sort -r "$RUNNER_TEMP/obsidian-artifacts.txt" | head -n 1 | cut -d' ' -f2)
          if [[ -z "$artifact_name" ]]; then
            echo "No prior recovery artifact; bootstrapping."
          else
            run_id="${artifact_name#obsidian-recovery-}"
            echo "Restoring $artifact_name from run $run_id"
            restored=false
            for attempt in 1 2 3 4 5; do
              if gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir outputs/backtest/obsidian-recovery; then
                restored=true
                break
              fi
              echo "Artifact download attempt $attempt failed; retrying transient storage errors."
              rm -rf outputs/backtest/obsidian-recovery
              mkdir -p outputs/backtest/obsidian-recovery
              sleep $((attempt * 8))
            done
            [[ "$restored" == true ]] || { echo "Checkpoint download failed after retries"; exit 1; }
            test -s outputs/backtest/obsidian-recovery/checkpoint.json || { echo "Incomplete checkpoint artifact"; exit 1; }
          fi
      - name: Recover missing/stale split windows (bounded probe)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python -m backtest.obsidian_recover_windows \
            --source outputs/backtest/hybrid-37386241124 \
            --out outputs/backtest/obsidian-recovery \
            --max-requests 400
      - name: Verify recovery progress accounting
        run: |
          python -c 'import json,pathlib; r=json.loads(pathlib.Path("outputs/backtest/obsidian-recovery/recovery.json").read_text()); assert r["total_candidate_windows"] == r["windows_checked_cumulative"] + r["remaining_unchecked"]; assert sum(r["counts"].values()) == r["windows_checked_cumulative"]; assert r["requests_this_run"] <= 400; print("Recovery accounting invariants verified")'
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-recovery-${{ github.run_id }}
          path: |
            outputs/backtest/obsidian-recovery/recovery.json
            outputs/backtest/obsidian-recovery/checkpoint.json
            outputs/backtest/obsidian-recovery/bar-cache/
          if-no-files-found: warn
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-historical-audit-${{ github.run_id }}
          path: outputs/backtest/obsidian-data-audit.json
          if-no-files-found: warn
          retention-days: 30
