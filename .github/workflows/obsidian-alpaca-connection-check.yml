name: OBSIDIAN Alpaca connection diagnostic (research only)
on:
  push:
    branches:
      - research/obsidian-early-rug-20261025
    paths:
      - '.github/workflows/obsidian-alpaca-connection-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpaca-read-only-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Alpaca credential authentication and SIP entitlement (GET only)
        env:
          ALPACA_API_KEY: ${{ secrets.OBSIDIAN_PAPER_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.OBSIDIAN_PAPER_SECRET_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          from backtest.obsidian_delayed_sip_integrity import inspect_delayed_sip
          import urllib.request
          import urllib.error
          from datetime import datetime, timedelta, timezone
          from urllib.parse import urlencode

          key = os.environ.get("ALPACA_API_KEY", "")
          secret = os.environ.get("ALPACA_SECRET_KEY", "")
          if not key or not secret:
              print("RESULT: MISSING_GITHUB_ACTIONS_CREDENTIAL")
              raise SystemExit(1)

          headers = {"APCA-API-KEY-ID": key, "APCA-API-SECRET-KEY": secret}
          endpoints = [
              ("PAPER_ACCOUNT", "https://paper-api.alpaca.markets/v2/account"),
              ("PAPER_ASSETS", "https://paper-api.alpaca.markets/v2/assets?status=active&asset_class=us_equity"),
              ("LIVE_ASSETS", "https://api.alpaca.markets/v2/assets?status=active&asset_class=us_equity"),
              ("SIP_SPY_SNAPSHOT", "https://data.alpaca.markets/v2/stocks/SPY/snapshot?feed=sip"),
              ("IEX_SPY_SNAPSHOT", "https://data.alpaca.markets/v2/stocks/SPY/snapshot?feed=iex"),
          ]
          # Historical SIP query: request bars entirely outside the 15-minute
          # real-time restriction. A 200 only proves endpoint access, not that
          # the response contains verified regular-session prices.
          now = datetime.now(timezone.utc)
          iso = lambda dt: dt.isoformat(timespec="seconds").replace("+00:00", "Z")
          start_dt = now - timedelta(minutes=45)
          end_dt = now - timedelta(minutes=30)
          query = urlencode({
              "symbols": "SPY", "timeframe": "1Min",
              "start": iso(start_dt),
              "end": iso(end_dt),
              "feed": "sip", "limit": 100,
          })
          endpoints.append(("DELAYED_SIP_SPY_BARS",
                            "https://data.alpaca.markets/v2/stocks/bars?" + query))
          # Fixed SPY regular-session sample from Oct 23, NOT an Oct 26
          # prospective capture retry or a trading signal/backfill.
          sample_start = datetime(2026, 10, 23, 18, 30, tzinfo=timezone.utc)
          sample_end = datetime(2026, 10, 23, 18, 45, tzinfo=timezone.utc)
          sample_query = urlencode({
              "symbols": "SPY", "timeframe": "1Min",
              "start": iso(sample_start), "end": iso(sample_end),
              "feed": "sip", "limit": 100,
          })
          endpoints.append(("HISTORICAL_SIP_SPY_SAMPLE",
                            "https://data.alpaca.markets/v2/stocks/bars?" + sample_query))
          results = {}
          delayed_content = "NOT_CHECKED"
          sample_content = "NOT_CHECKED"
          for label, url in endpoints:
              request = urllib.request.Request(url, headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      status = response.status
                      if label in ("DELAYED_SIP_SPY_BARS", "HISTORICAL_SIP_SPY_SAMPLE") and status == 200:
                          try:
                              payload = json.loads(response.read(2_000_000))
                              inspected = inspect_delayed_sip(
                                  payload, "SPY",
                                  sample_start if label == "HISTORICAL_SIP_SPY_SAMPLE" else start_dt,
                                  sample_end if label == "HISTORICAL_SIP_SPY_SAMPLE" else end_dt,
                                  datetime.now(timezone.utc))
                              if label == "HISTORICAL_SIP_SPY_SAMPLE":
                                  sample_content = inspected["status"] + "_COUNT_" + str(inspected["valid_bars"])
                                  sample_bars = payload.get("bars", {}).get("SPY", [])
                                  if isinstance(sample_bars, list):
                                      print("HISTORICAL_SIP_SAMPLE_RETURNED_BARS:", len(sample_bars))
                                      print("HISTORICAL_SIP_SAMPLE_TIMESTAMPS:",
                                            json.dumps([b.get("t") for b in sample_bars[:2]
                                                        if isinstance(b, dict)]))
                              else:
                                  delayed_content = inspected["status"]
                          except (ValueError, UnicodeError, TypeError):
                              if label == "HISTORICAL_SIP_SPY_SAMPLE":
                                  sample_content = "INVALID_RESPONSE_JSON"
                              else:
                                  delayed_content = "INVALID_RESPONSE_JSON"
              except urllib.error.HTTPError as error:
                  status = error.code
              except Exception as error:
                  print(f"{label}: TRANSPORT_ERROR_{type(error).__name__}")
                  results[label] = None
                  continue
              results[label] = status
              if status == 200:
                  print(f"{label}: AUTHORIZED_HTTP_200")
              elif status == 401:
                  print(f"{label}: UNAUTHORIZED_HTTP_401")
              elif status == 403:
                  print(f"{label}: FORBIDDEN_HTTP_403")
              else:
                  print(f"{label}: HTTP_{status}")
          account_ok = results.get("PAPER_ACCOUNT") == 200
          assets_ok = results.get("PAPER_ASSETS") == 200 or results.get("LIVE_ASSETS") == 200
          sip_ok = results.get("SIP_SPY_SNAPSHOT") == 200
          iex_ok = results.get("IEX_SPY_SNAPSHOT") == 200
          delayed_sip_ok = results.get("DELAYED_SIP_SPY_BARS") == 200
          print("DELAYED_SIP_RESULT:", "ENDPOINT_HTTP_200" if delayed_sip_ok else "NOT_ACCESSIBLE")
          print("DELAYED_SIP_CONTENT:", delayed_content)
          print("HISTORICAL_SIP_SAMPLE_CONTENT:", sample_content)
          print("MARKET_DATA_RESULT:", "SIP_AVAILABLE" if sip_ok else
                "IEX_ONLY_SIP_BLOCKED" if iex_ok else "NO_TESTED_FEED_AVAILABLE")
          print("RESULT:", "PAPER_ACCOUNT_AUTH_BLOCKED" if not account_ok else
                "ASSET_ACCESS_BLOCKED" if not assets_ok else
                "SIP_DATA_ACCESS_BLOCKED_IEX_AVAILABLE" if iex_ok and not sip_ok else
                "SIP_AND_IEX_DATA_ACCESS_BLOCKED" if not sip_ok else "READ_ONLY_CONNECTION_OK")
          print("RESEARCH_FEED_READY:", "IEX_DISCOVERY_ONLY" if account_ok and assets_ok and iex_ok else "NO")
          print("CONSOLIDATED_REALTIME_READY:", "YES" if sip_ok else "NO")
          raise SystemExit(0 if account_ok and assets_ok and (sip_ok or iex_ok) else 1)
          PY
