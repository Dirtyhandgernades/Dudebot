name: One practice Discord reference check # Existing receipt is reformatted into an embed; no second ping.
on:
  push:
    branches: [main]
    paths: [.github/workflows/practice.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smg-state-writer
  cancel-in-progress: false
jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_ENABLED: ${{ vars.DISCORD_ENABLED || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - run: python -m pip install -e . -c requirements-tested.txt
      - run: python -m smg.cli practice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practice-reference-receipt
          path: reports/
