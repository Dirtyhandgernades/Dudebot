name: OBSIDIAN free quant evidence packet (research only)
on:
  push:
    branches: [research/obsidian-early-rug-20261025]
    paths:
      - '.github/workflows/obsidian-free-quant-feed.yml'
      - 'backtest/obsidian_free_quant_feed.py'
      - 'tests/test_obsidian_free_quant_feed.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packet:
    if: github.ref == 'refs/heads/research/obsidian-early-rug-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline source and clock gates before live requests
        run: python -m unittest tests.test_obsidian_free_quant_feed tests.test_obsidian_prospective_independent_quote_halt -v
      - name: Install bounded read-only HTTP dependency
        if: github.event_name == 'workflow_dispatch'
        run: python -m pip install 'requests>=2.32,<3'
      - name: Collect one research-only quant packet with existing free sources
        if: github.event_name == 'workflow_dispatch'
        env:
          ALPACA_API_KEY: ${{ secrets.OBSIDIAN_PAPER_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.OBSIDIAN_PAPER_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: >-
          python -m backtest.obsidian_free_quant_feed
          --output outputs/backtest/free-quant-${{ github.run_id }}.json
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: obsidian-free-quant-${{ github.run_id }}
          path: outputs/backtest/free-quant-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 90
