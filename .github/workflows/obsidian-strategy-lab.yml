name: OBSIDIAN bounded strategy lab (research only)
on:
  push:
    branches: [research/obsidian-early-rug-20261025]
    paths:
      - '.github/workflows/obsidian-strategy-lab.yml'
      - 'backtest/obsidian_strategy_lab.py'
      - 'backtest/obsidian_rank_control.py'
      - 'backtest/obsidian_research_runner.py'
      - 'backtest/obsidian_portfolio_guard.py'
      - 'backtest/obsidian_identity_probe.py'
      - 'backtest/obsidian_continuity_repair.py'
      - 'tests/test_obsidian_strategy_lab.py'
      - 'backtest/evidence/2026-11-20/strategy-overhaul/continuity-repair-registration.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: obsidian-bounded-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/research/obsidian-early-rug-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository-pinned research dependencies
        run: python -m pip install -e '.[test]' -c requirements-tested.txt
      - name: Test research and paper-account gates
        run: python -m pytest -q
      - name: Retrieve and authenticate original hybrid ZIP bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p outputs/backtest/hybrid-37386241124 outputs/research-source
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11378995592/zip" > outputs/research-source/hybrid-original.zip
          echo 'a53ffdb85d7d373912a3483d6894c4e841ce0c54a42c77987f3f121aa7f20e6e  outputs/research-source/hybrid-original.zip' | sha256sum -c -
          unzip -q outputs/research-source/hybrid-original.zip -d outputs/backtest/hybrid-37386241124
      - name: Reproduce baseline, audit all trades and execute registered diagnostics
        run: >-
          python -m backtest.obsidian_research_runner
          --out outputs/backtest/obsidian-lab-${{ github.run_id }}
      - name: Verify resume without repeating completed experiments
        env:
          RESEARCH_OUT: outputs/backtest/obsidian-lab-${{ github.run_id }}
        run: |
          set -euo pipefail
          before=$(sha256sum "$RESEARCH_OUT/checkpoint.json" | cut -d' ' -f1)
          python -m backtest.obsidian_research_runner --out "$RESEARCH_OUT"
          after=$(sha256sum "$RESEARCH_OUT/checkpoint.json" | cut -d' ' -f1)
          test "$before" = "$after"
      - name: Probe documented missing issuer continuity without changing prices
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPACA_API_KEY: ${{ secrets.OBSIDIAN_PAPER_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.OBSIDIAN_PAPER_SECRET_KEY }}
        run: >-
          python -m backtest.obsidian_identity_probe
          --out outputs/backtest/obsidian-identity-${{ github.run_id }}
      - name: Stage separately registered valuation continuity without changing baseline
        run: >-
          python -m backtest.obsidian_continuity_repair
          --probe outputs/backtest/obsidian-identity-${{ github.run_id }}
          --out outputs/backtest/obsidian-continuity-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obsidian-strategy-lab-${{ github.run_id }}
          path: |
            outputs/backtest/obsidian-lab-${{ github.run_id }}/
            outputs/backtest/target-rank-2026-10-05/
            outputs/research-source/
            outputs/backtest/obsidian-identity-${{ github.run_id }}/
            outputs/backtest/obsidian-continuity-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90
