name: Activate firm-first Discord deployment
on:
  push:
    branches: [main]
    paths: [config/deployment.json, .github/workflows/activate.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smg-state-writer
  cancel-in-progress: false
jobs:
  activate:
    if: vars.SMG_LIVE_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_ENABLED: ${{ vars.DISCORD_ENABLED || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - run: python -m pip install -e '.[test]' -c requirements-tested.txt
      - run: python -m pytest -q
      - run: python -m smg.cli doctor
      - run: python -m smg.cli discover
      - run: python -m smg.cli activate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activation-receipt
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
