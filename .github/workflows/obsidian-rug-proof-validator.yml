name: OBSIDIAN rug-proof workflow YAML and provenance checks (offline)
on:
  push:
    branches:
      - research/obsidian-early-rug-20261025
    paths:
      - '.github/workflows/obsidian-rug-proof-anchor.yml'
      - '.github/workflows/obsidian-rug-proof-delayed-sip.yml'
      - '.github/workflows/obsidian-rug-proof-validator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-research-only-source-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate independent source and delayed-SIP workflow structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          paths=[
              '.github/workflows/obsidian-rug-proof-anchor.yml',
              '.github/workflows/obsidian-rug-proof-delayed-sip.yml',
          ]
          for path in paths:
              raw=Path(path).read_text()
              data=yaml.safe_load(raw)
              events=data.get('on',data.get(True,{}))
              assert 'push' in events
              assert events['push']['branches']==['research/obsidian-early-rug-20261025']
              assert data['permissions']['contents']=='read'
              assert len(data['jobs'])==1
              assert 'pull_request' not in events and 'schedule' not in events
              assert 'paper-api.alpaca.markets/v2/clock' in raw
              assert 'secrets.OBSIDIAN_PAPER_API_KEY_ID' in raw
              assert 'secrets.OBSIDIAN_PAPER_SECRET_KEY' in raw
              assert '/v2/orders' not in raw and 'git push origin main' not in raw
              assert 'research/obsidian-early-rug-20261025' in raw
              print('VALIDATED_RESEARCH_BRANCH_ONLY_YAML',path)
          PY
      - name: Verify all offline prospective capture/fallback tests
        run: python -m unittest discover -s tests -p 'test_obsidian_prospective_*.py' -q
