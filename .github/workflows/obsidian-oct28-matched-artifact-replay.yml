name: OBSIDIAN original Oct28 matched-cohort replay (research only)
on:
  push:
    branches:
      - research/obsidian-early-rug-20261025
    paths:
      - '.github/workflows/obsidian-oct28-matched-artifact-replay.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: obsidian-oct28-matched-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    if: github.ref == 'refs/heads/research/obsidian-early-rug-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original offline capture and cohort tests
        run: python -m unittest discover -s tests -p 'test_obsidian_prospective_*.py' -q
      - name: Download original write-once morning and intraday artifacts (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs
          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Dirtyhandgernades/Dudebot/actions/artifacts/12822044262/zip" \
            --output inputs/morning.zip
          printf '%s  %s\n' '581de21834482d82a2ee8e91f8077c7497141e94e5b9deec16f7d8727cde6110' 'inputs/morning.zip' | sha256sum --check
          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Dirtyhandgernades/Dudebot/actions/artifacts/12837584509/zip" \
            --output inputs/intraday.zip
          printf '%s  %s\n' '07e6d370e0a52b2c887c21f46d41273f0ea50fefbefd47dce53abf5571085801' 'inputs/intraday.zip' | sha256sum --check
      - name: Reverify raw manifests, retain full denominator, lock correlated cohort
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import stat
          from zipfile import ZipFile
          from backtest.obsidian_matched_cohort_lock import lock

          expected_files = {"manifest.json", "universe.jsonl", "attention.json"}
          def extract_exact(archive, target):
              with ZipFile(archive) as z:
                  members = z.infolist()
                  names = [m.filename for m in members]
                  if len(names) != 3 or set(names) != expected_files:
                      raise ValueError("UNEXPECTED_OR_DUPLICATE_OR_NESTED_ARTIFACT_FILES")
                  if any(m.is_dir() or stat.S_ISLNK(m.external_attr >> 16)
                         or m.file_size == 0 or m.file_size > 100_000_000 for m in members):
                      raise ValueError("UNSAFE_OR_EMPTY_ARTIFACT_FILE")
                  if sum(m.file_size for m in members) > 120_000_000:
                      raise ValueError("ARTIFACT_UNCOMPRESSED_SIZE_LIMIT")
                  target.mkdir(parents=True, exist_ok=False)
                  for m in members:
                      with (target / m.filename).open("xb") as dest:
                          dest.write(z.read(m))
          extract_exact(Path("inputs/morning.zip"), Path("inputs/morning"))
          extract_exact(Path("inputs/intraday.zip"), Path("inputs/intraday"))
          result = lock("inputs/morning", "inputs/intraday")
          counts = result["counts"]
          if (result["session_date"] != "2026-10-28" or
              counts["union_symbols"] != 8511 or
              counts["morning_present"] != 8511 or
              counts["intraday_present"] != 8511 or
              counts["morning_watches"] != 264 or
              counts["intraday_watches"] != 342 or
              len(result["full_original_union_rows"]) != 8511):
              raise ValueError("ORIGINAL_CAPTURE_IDENTITY_OR_DENOMINATOR_CHANGED")
          if result["externally_verified_outcome_rows"] != 0 or result["matched_outcome_scoring_enabled"]:
              raise ValueError("UNAUTHORIZED_PERFORMANCE_CLAIM")
          output = Path("outputs/obsidian-oct28-matched-cohort")
          output.mkdir(parents=True, exist_ok=False)
          with (output / "full_unselected_matched_cohort.json").open("x") as f:
              json.dump(result, f, indent=2, sort_keys=True)
              f.write("\n")
          evidence = {
              "mode": "RESEARCH_ONLY_NOT_AN_ORDER",
              "session_date": "2026-10-28",
              "morning_run_id": 40704289113,
              "morning_artifact_id": 12822044262,
              "morning_zip_sha256": hashlib.sha256(Path("inputs/morning.zip").read_bytes()).hexdigest(),
              "intraday_run_id": 40739809362,
              "intraday_artifact_id": 12837584509,
              "intraday_zip_sha256": hashlib.sha256(Path("inputs/intraday.zip").read_bytes()).hexdigest(),
              "morning_universe_sha256": result["morning_original_universe_sha256"],
              "intraday_universe_sha256": result["intraday_original_universe_sha256"],
              "counts": counts,
              "original_unselected_denominator_retained": True,
              "externally_verified_regular_close_outcomes": 0,
              "predictive_edge_established": False,
              "actual_smg_trade_verified": False,
              "durable_backup_verified": False,
          }
          with (output / "original_artifact_evidence_summary.json").open("x") as f:
              json.dump(evidence, f, indent=2, sort_keys=True)
              f.write("\n")
          print(json.dumps(evidence, sort_keys=True))
          PY
      - name: Upload derived matched-cohort audit only (not original raw captures)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-oct28-matched-cohort-${{ github.run_id }}
          path: outputs/obsidian-oct28-matched-cohort/
          if-no-files-found: error
          retention-days: 90
