name: OBSIDIAN IEX early discovery (research only)
on:
  push:
    branches:
      - research/obsidian-early-rug-20261025
    paths:
      - '.github/workflows/obsidian-iex-research-discovery.yml'
      - 'backtest/OBSIDIAN_IEX_RESEARCH_DISCOVERY_TRIGGER_*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obsidian-iex-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discovery:
    if: github.ref == 'refs/heads/research/obsidian-early-rug-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify offline source-limited discovery tests
        run: python -m unittest discover -s tests -p 'test_obsidian_prospective_iex_research_discovery.py' -v
      - name: Install GET-only provider dependency
        run: python -m pip install 'requests>=2.32,<3'
      - name: Collect and hash single-venue read-only discovery evidence
        env:
          ALPACA_API_KEY: ${{ secrets.OBSIDIAN_PAPER_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.OBSIDIAN_PAPER_SECRET_KEY }}
        run: |
          python -m backtest.obsidian_iex_research_discovery \
            --out "outputs/backtest/obsidian-iex-research-discovery/${{ github.run_id }}"
      - name: Verify artifact without recontacting provider
        run: |
          python - <<'PY'
          from pathlib import Path
          from backtest.obsidian_iex_research_discovery import verify
          import os
          root = Path("outputs/backtest/obsidian-iex-research-discovery") / os.environ["GITHUB_RUN_ID"]
          if root.exists():
              print(verify(root))
          else:
              print("No artifact: run outside permitted research reconnaissance hours")
          PY
      - name: Upload write-once source-limited discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-iex-research-discovery-${{ github.run_id }}
          path: outputs/backtest/obsidian-iex-research-discovery/${{ github.run_id }}/
          if-no-files-found: ignore
          retention-days: 90
