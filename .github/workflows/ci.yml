name: Offline tests
on:
  push:
    branches-ignore: [smg-state]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' -c requirements-tested.txt
      - run: python -m pytest -q
      - run: python -m smg.cli demo
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo
          path: reports/
