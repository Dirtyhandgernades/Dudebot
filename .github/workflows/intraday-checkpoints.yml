name: Test firm signals throughout the session
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: intraday-checkpoint-study
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - run: python -m pip install -e '.[test]' -c requirements-tested.txt
      - run: python -m pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: action-policy-37502827341
          run-id: 37502827341
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backtest/runtime/checkpoint-inputs
      - uses: actions/cache@v4
        with:
          path: backtest/runtime/checkpoint-bars
          key: checkpoint-bars-v1-${{ github.run_id }}
          restore-keys: checkpoint-bars-v1-
      - run: python -u -m backtest.intraday_checkpoint_study --packet backtest/runtime/checkpoint-inputs/action-inputs/inputs.json.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intraday-checkpoints-${{ github.run_id }}
          path: reports/intraday-checkpoints/
          retention-days: 90
