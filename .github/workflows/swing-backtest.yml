name: Game-period swing outcome backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [smg/swing_backtest.py, smg/risk_model.py, .github/workflows/swing-backtest.yml]
permissions:
  contents: read
  actions: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - run: python -m pip install -e '.[test]' -c requirements-tested.txt
      - run: python -m pytest -q tests/test_swing_backtest.py
      - uses: actions/download-artifact@v4
        with:
          name: independent-source-replay-35415517622
          run-id: 35415517622
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backtest/runtime/corrected-replay
      - name: Fetch point-in-time evidence archive when available
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: smg-state
          path: backtest/runtime/evidence
      - uses: actions/cache@v4
        with:
          path: backtest/runtime/swing-bars
          key: swing-bars-v1-${{ github.run_id }}
          restore-keys: swing-bars-v1-
      - name: Evaluate fixed hypotheses without reference tickers
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m smg.swing_backtest --evidence-db backtest/runtime/evidence/runtime/state.sqlite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-period-outcomes-${{ github.run_id }}
          path: reports/swing-backtest/
