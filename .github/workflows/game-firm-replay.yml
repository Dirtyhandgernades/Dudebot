name: Game firm coverage and risk replay
on:
  schedule:
    - cron: '41 4 * * 2-6'
  workflow_dispatch:
    inputs:
      max_documents:
        description: Maximum new SEC documents; 0 validates cached sources only
        type: number
        default: 1200
      source_mode:
        description: Gather new evidence only or run a full replay
        type: choice
        options: [gather, replay]
        default: gather
      priority_period:
        description: Prioritize thin earlier-year evidence without selecting winner symbols
        type: choice
        options: [earlier_years, balanced]
        default: earlier_years
permissions:
  contents: read
  actions: read
concurrency:
  group: game-firm-replay
  queue: max
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      # Code pushes validate caches without launching another large gather.
      MAX_SOURCE_DOWNLOADS: ${{ inputs.max_documents || (github.event_name == 'schedule' && 200) || 0 }}
      SOURCE_MODE: ${{ inputs.source_mode || 'gather' }}
      SOURCE_PRIORITY: ${{ inputs.priority_period || 'earlier_years' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - run: python -m pip install -e '.[test]' -c requirements-tested.txt
      - run: python -m pytest -q
      - uses: actions/download-artifact@v4
        if: env.SOURCE_MODE == 'replay'
        with:
          name: historical-checkpoint-34191049268-1
          run-id: 34191049268
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backtest/runtime/independent-checkpoint
      - uses: actions/download-artifact@v4
        if: env.SOURCE_MODE == 'replay'
        with:
          name: independent-source-replay-35415517622
          run-id: 35415517622
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backtest/runtime/corrected-replay
      - uses: actions/cache@v4
        with:
          path: backtest/runtime/source-replay
          key: game-sources-v1-${{ github.run_id }}
          restore-keys: |
            game-sources-v1-
            source-replay-v2-main-
            source-replay-v2-
      - uses: actions/cache@v4
        with:
          path: backtest/runtime/game-firm-search
          key: game-firm-search-v1-${{ github.run_id }}
          restore-keys: game-firm-search-v1-
      - uses: actions/cache@v4
        with:
          path: backtest/runtime/swing-bars
          key: swing-bars-v1-${{ github.run_id }}
          restore-keys: swing-bars-v1-
      - name: Independently discover dated firms and test fixed research policies
        run: |
          if [ "$SOURCE_MODE" = "gather" ]; then
            python -m smg.game_firm_replay --baseline backtest/runtime/corrected-replay/decisions.json --max-documents "$MAX_SOURCE_DOWNLOADS" --priority-period "$SOURCE_PRIORITY" --max-seconds 360 --gather-only
          else
            python -m smg.game_firm_replay --baseline backtest/runtime/corrected-replay/decisions.json --max-documents "$MAX_SOURCE_DOWNLOADS" --priority-period "$SOURCE_PRIORITY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-firm-coverage-${{ github.run_id }}
          path: reports/game-firm-replay/
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: backtest/runtime/source-replay
          key: game-sources-v1-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: backtest/runtime/game-firm-search
          key: game-firm-search-v1-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: backtest/runtime/swing-bars
          key: swing-bars-v1-${{ github.run_id }}
