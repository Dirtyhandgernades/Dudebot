name: Broad volatility shortlist
on:
  schedule:
    # Two market-day passes catch morning and afternoon pumps while the
    # 15-minute scanner remains limited to eight broad candidates.
    - cron: '47 15,18 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smg-state-writer
  cancel-in-progress: false
jobs:
  discover:
    if: vars.SMG_LIVE_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - run: python -m pip install -e . -c requirements-tested.txt
      - run: python -m smg.cli broad-discover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broad-volatility-${{ github.run_id }}
          path: reports/broad-discovery.json
          if-no-files-found: error
          retention-days: 30
