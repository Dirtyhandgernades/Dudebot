name: OBSIDIAN pinned artifact ZIP restore audit (offline research only)
on:
  push:
    branches: [research/obsidian-early-rug-20261025]
    paths:
      - '.github/workflows/obsidian-pinned-zip-restore-audit.yml'
      - 'backtest/obsidian_pinned_zip_restore_audit.py'
      - 'tests/test_obsidian_pinned_zip_restore_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-restore-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify ZIP digest, CRC, exact member and issuer identity fail-closed fixtures
        run: python -m unittest tests.test_obsidian_pinned_zip_restore_audit -v
