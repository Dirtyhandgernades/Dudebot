name: Deploy free Cloudflare dispatcher
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [cloudflare/**, .github/workflows/cloudflare.yml, smg/cloud_dispatch.py, smg/notify.py, smg/cli.py]
permissions:
  contents: write
concurrency:
  group: smg-state-writer
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_ENABLED: ${{ vars.DISCORD_ENABLED || 'true' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check account connection
        id: connection
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets, then run this workflow. No deployment attempted."
          fi
      - uses: actions/checkout@v4
        if: steps.connection.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.connection.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - uses: actions/setup-node@v4
        if: steps.connection.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Validate before deployment
        if: steps.connection.outputs.ready == 'true'
        run: |
          python -m pip install -e '.[test]' -c requirements-tested.txt
          python -m pytest -q
          node --test cloudflare/core.test.mjs
      - name: Deploy dispatcher
        id: deploy
        if: steps.connection.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.1'
          workingDirectory: cloudflare
          command: deploy --config wrangler.jsonc
      - name: Install secrets without logging their values
        if: steps.connection.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json,os,subprocess
          from smg.cloud_dispatch import dispatch_key
          webhook=os.environ['DISCORD_WEBHOOK_URL']
          if not webhook:raise SystemExit('DISCORD_WEBHOOK_URL is missing')
          payload=json.dumps({'DISCORD_WEBHOOK_URL':webhook,'DISPATCH_KEY':dispatch_key(webhook)})
          subprocess.run(['npx','--yes','wrangler@4.129.1','secret','bulk','--config','wrangler.jsonc'],input=payload,text=True,check=True,cwd='cloudflare')
          PY
      - name: Verify hosted Discord access and select Cloudflare delivery
        if: steps.connection.outputs.ready == 'true'
        env:
          CLOUDFLARE_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: python -m smg.cloud_dispatch
      - uses: actions/upload-artifact@v4
        if: always() && steps.connection.outputs.ready == 'true'
        with:
          name: cloudflare-deployment-receipt
          path: reports/cloudflare-deployment.json
          if-no-files-found: ignore
