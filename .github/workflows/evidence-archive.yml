name: Point-in-time evidence archive
on:
  schedule:
    # Covers the U.S. session in both daylight and standard time. The collector
    # timestamps every observation and labels periods without a delayed bar.
    # Offset from the top of the hour to reduce GitHub schedule congestion.
    - cron: '7,22,37,52 13-21 * * 1-5'
    # Two fallback checks when the Cloudflare dispatcher owns quarter-hour runs.
    - cron: '17 16,19 * * 1-5'
    - cron: '35 23 * * 1-5'
  push:
    branches: [main]
    paths: [smg/live_firms.py, smg/cli.py, smg/runner.py, smg/shadow.py, smg/learning.py, config/frozen_forward.json, .github/workflows/evidence-archive.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: Collect current evidence or backfill bounded public history
        type: choice
        options: [current, backfill]
        default: current
permissions:
  contents: write
concurrency:
  group: smg-state-writer-v2
  queue: max
  cancel-in-progress: false
jobs:
  archive:
    if: >-
      vars.SMG_LIVE_ENABLED != 'false' &&
      (github.event_name != 'schedule' ||
       github.event.schedule == '35 23 * * 1-5' ||
       github.event.schedule == '17 16,19 * * 1-5' ||
       (github.event.schedule == '7,22,37,52 13-21 * * 1-5' && vars.CLOUDFLARE_CRON_ENABLED != 'true'))
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_ENABLED: ${{ vars.DISCORD_ENABLED || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - run: python -m pip install -e . -c requirements-tested.txt
      - name: Prioritize firm watches with matching completed daily rank features
        if: github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule != '35 23 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode != 'backfill')
        run: python -m smg.ranked_firm --prepare
      - name: Alert once when a new trade phase qualifies
        if: github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule != '35 23 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode != 'backfill')
        run: python -m smg.cli alert --send
      - name: Archive current market and borrow snapshot
        # Each command restores/checkpoints state independently. Keep failures
        # visible, but do not let a legacy alert error skip fresh evidence.
        if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule != '35 23 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode != 'backfill')) }}
        run: python -m smg.cli archive
      - name: Enrich eight pending symbols with daily fundamentals and sentiment
        if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule != '35 23 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode != 'backfill')) }}
        run: python -m smg.cli archive-enrich
      - name: Publish newly qualified ranked firm signals and distinct research watches
        if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule != '35 23 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode != 'backfill')) }}
        run: python -m smg.ranked_firm --send
      - name: Review prior scans against subsequent closes
        if: (github.event_name == 'schedule' && github.event.schedule == '35 23 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill')
        run: python -m smg.cli review
      - name: Backfill ten public halt and FINRA sessions
        if: ${{ !cancelled() && ((github.event_name == 'schedule' && github.event.schedule == '35 23 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill')) }}
        run: python -m smg.cli archive-backfill --max-days 10
      - name: Learn realized policy returns and squeeze losses without retuning live weights
        if: ${{ !cancelled() && ((github.event_name == 'schedule' && github.event.schedule == '35 23 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill')) }}
        run: |
          python -m smg.ranked_firm --collect-only
          python -m smg.action_learning --state runtime/state.sqlite --out reports/action-policy-learning.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-archive-${{ github.run_id }}
          path: |
            reports/evidence-*.json
            reports/latest.json
            reports/discord-payloads.json
            reports/daily-outcome-review.json
            reports/frozen-forward-capture.json
            reports/action-policy-learning.json
            reports/ranked-firm-alerts.json
          if-no-files-found: ignore
          retention-days: 30
